<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c727d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TopKid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>TopKid Events — Business Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   TopKid Events — Local Business Dashboard
   Single file. No server. Data lives in this browser's
   localStorage, and can be exported/imported as JSON.
   ============================================================ */

/* ---------- Tokens: light ---------- */
:root{
  color-scheme: light;
  --bg:#f4f3f8;
  --surface:#ffffff;
  --surface-2:#faf9fc;
  --surface-3:#f1eff7;
  --ink:#111118;
  --ink-2:#3d3d4a;
  --muted:#6b6b78;
  --rule:#e6e5ee;
  --rule-strong:#d3d2df;

  --purple:#c727d5;
  --purple-dark:#a01fb0;
  --purple-soft:#f9e9fb;
  --green:#12a150;
  --green-bright:#4cd964;
  --green-soft:#e6f6ec;

  /* categorical series — validated (light): CVD ΔE 20.9, normal ΔE 42.3, both ≥3:1 */
  --series-1:#c727d5;   /* Fundraising */
  --series-2:#12a150;   /* Summer Camp */
  --series-other:#6b6b78;

  /* status — always shipped with a label, never colour alone */
  --good:#12784a; --good-bg:#e6f4ec;
  --warn:#8a5a00; --warn-bg:#fdf1dc;
  --crit:#b02222; --crit-bg:#fbe9e9;
  --info:#2a5fb0; --info-bg:#e8effa;

  --grid:#ececf3;
  --shadow:0 1px 2px rgba(17,17,24,.05), 0 8px 24px rgba(17,17,24,.06);
  --shadow-lg:0 12px 40px rgba(17,17,24,.18);
  --r:14px; --r-sm:9px;
}
/* ---------- Tokens: dark ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101015;
    --surface:#1a1a21;
    --surface-2:#20202a;
    --surface-3:#272733;
    --ink:#f3f2f7;
    --ink-2:#cfcedb;
    --muted:#a09eb0;
    --rule:#2c2c38;
    --rule-strong:#3b3b49;
    --purple:#d95ce4;
    --purple-dark:#e07eea;
    --purple-soft:#2e1733;
    --green:#2ba75f;
    --green-bright:#4cd964;
    --green-soft:#122a1c;
    --series-1:#c727d5;
    --series-2:#2ba75f;
    --series-other:#8f8da0;
    --good:#4cc98a; --good-bg:#14301f;
    --warn:#e0a83c; --warn-bg:#332714;
    --crit:#f07171; --crit-bg:#361a1a;
    --info:#79a8f0; --info-bg:#16233a;
    --grid:#2a2a34;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101015; --surface:#1a1a21; --surface-2:#20202a; --surface-3:#272733;
  --ink:#f3f2f7; --ink-2:#cfcedb; --muted:#a09eb0; --rule:#2c2c38; --rule-strong:#3b3b49;
  --purple:#d95ce4; --purple-dark:#e07eea; --purple-soft:#2e1733;
  --green:#2ba75f; --green-bright:#4cd964; --green-soft:#122a1c;
  --series-1:#c727d5; --series-2:#2ba75f; --series-other:#8f8da0;
  --good:#4cc98a; --good-bg:#14301f;
  --warn:#e0a83c; --warn-bg:#332714;
  --crit:#f07171; --crit-bg:#361a1a;
  --info:#79a8f0; --info-bg:#16233a;
  --grid:#2a2a34;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Bree Serif',Georgia,serif;font-weight:400;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple-dark)}
.wordmark{font-family:'Bree Serif',Georgia,serif}
.wordmark .t{color:var(--purple)} .wordmark .k{color:var(--green-bright)}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--rule);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 4px}
.brand .logo{font-size:25px}
.brand .sub{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.navlist{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.navsec{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;font-weight:700}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:9px 10px;color:var(--ink-2);font-size:14.5px;
}
.navbtn:hover{background:var(--surface-3)}
.navbtn[aria-current="true"]{background:var(--purple-soft);color:var(--purple-dark);font-weight:700}
.navbtn .ic{width:19px;text-align:center;font-size:15px}
.navbtn .badge{margin-left:auto;background:var(--crit-bg);color:var(--crit);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.navbtn .badge.q{background:var(--surface-3);color:var(--muted)}
.sidefoot{margin-top:22px;padding:12px 10px 0;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}

.main{flex:1;min-width:0;padding:24px 30px 80px;max-width:1500px}
.topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-size:27px;color:var(--purple-dark)}
.topbar .lede{color:var(--muted);font-size:13.5px;margin-top:3px}
.topbar .spacer{flex:1}

/* ---------- Buttons / chips ---------- */
.btn{
  border:1px solid var(--rule-strong);background:var(--surface);border-radius:9px;
  padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink-2);
}
.btn:hover{background:var(--surface-3);border-color:var(--muted)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--purple-dark);border-color:var(--purple-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--crit);border-color:var(--rule-strong)}
.btn.danger:hover{background:var(--crit-bg);border-color:var(--crit)}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{
  border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.neutral{background:var(--surface-3);color:var(--muted)}
.tag.brand{background:var(--purple-soft);color:var(--purple-dark)}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);min-width:0;
}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:16px;color:var(--ink)}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cardhead .spacer{flex:1}
.cardhead .hint{font-size:12px;color:var(--muted)}
.sectitle{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:26px 0 10px}

/* ---------- Stat tiles ---------- */
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .val{font-family:'Bree Serif',Georgia,serif;font-size:31px;line-height:1.15;margin-top:6px;letter-spacing:-.01em}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat .val small{font-size:16px;color:var(--muted);font-family:'DM Sans',sans-serif}

/* ---------- Meters ---------- */
.meter{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.meter > i{display:block;height:100%;border-radius:999px;background:var(--purple)}
.meter.g > i{background:var(--green)}
.meterrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--rule)}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.click:hover{background:var(--surface-2);cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:13.5px}
.empty .big{font-size:26px;margin-bottom:8px;opacity:.55}

/* ---------- Forms / modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(12,12,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:900;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(680px,100%);border:1px solid var(--rule)}
.modal header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--rule)}
.modal header h3{font-size:19px;color:var(--purple-dark);flex:1}
.modal .body{padding:20px;display:grid;gap:14px}
.modal footer{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--rule);background:var(--surface-2);border-radius:0 0 16px 16px}
.field label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=email],input[type=tel],input[type=url],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--rule-strong);border-radius:9px;background:var(--surface-2);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--purple);outline-offset:1px;background:var(--surface)}
textarea{min-height:84px;resize:vertical;font-family:inherit}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.checkrow{display:flex;gap:14px;flex-wrap:wrap}
.checkrow label{display:flex;align-items:center;gap:6px;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:400;margin:0}

/* ---------- Quote ---------- */
.quotecard{
  background:linear-gradient(135deg,var(--purple-soft),var(--surface) 68%);
  border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);
  display:flex;gap:18px;align-items:flex-start;
}
.quotecard .mark{font-family:'Bree Serif',serif;font-size:46px;color:var(--purple);line-height:.8;opacity:.55}
.quotecard blockquote{margin:0;font-family:'Bree Serif',Georgia,serif;font-size:20px;line-height:1.35}
.quotecard cite{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:9px;font-family:'DM Sans',sans-serif}

/* ---------- Charts ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chartwrap{position:relative;overflow-x:auto}
.tip{
  position:fixed;z-index:800;pointer-events:none;background:var(--ink);color:var(--bg);
  border-radius:8px;padding:8px 11px;font-size:12.5px;box-shadow:var(--shadow-lg);max-width:250px;
}
.tip b{color:var(--bg)}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.sparkwrap{height:34px}

/* ---------- Map ---------- */
#map{height:430px;border-radius:var(--r);z-index:1}
.leaflet-popup-content{font-family:'DM Sans',sans-serif;font-size:13px;margin:11px 13px}
.mapfallback{height:430px;background:var(--surface-2);border-radius:var(--r);position:relative}

/* ---------- Todos ---------- */
.todoitem{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--rule)}
.todoitem:last-child{border-bottom:0}
.todoitem .cb{width:19px;height:19px;flex:0 0 19px;border:2px solid var(--rule-strong);border-radius:6px;background:transparent;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;padding:0}
.todoitem .cb:hover{border-color:var(--purple)}
.todoitem.done .cb{background:var(--green);border-color:var(--green)}
.todoitem.done .ttl{text-decoration:line-through;color:var(--muted)}
.todoitem .body{flex:1;min-width:0}
.todoitem .ttl{font-size:14.5px;line-height:1.35}
.todoitem .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.todoitem .acts{opacity:0;display:flex;gap:4px}
.todoitem:hover .acts{opacity:1}
.quickadd{display:flex;gap:8px;margin-bottom:6px}
.quickadd input{flex:1}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--rule)}
.tlitem{position:relative;padding:0 0 16px}
.tlitem::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--purple);border:2px solid var(--surface)}
.tlitem .d{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tlitem .t{font-size:14px;margin-top:2px}
.tlitem .n{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap}

/* ---------- Detail drawer ---------- */
.drawer-back{position:fixed;inset:0;background:rgba(12,12,18,.5);z-index:880;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow-lg);border-left:1px solid var(--rule)}
.drawer .dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:18px 22px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.drawer .dhead h2{font-size:22px;color:var(--purple-dark)}
.drawer .dbody{padding:20px 22px 60px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:132px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding-top:1px}
.kv dd{margin:0}

/* ---------- Banner ---------- */
.banner{display:flex;gap:12px;align-items:center;padding:11px 15px;border-radius:11px;font-size:13.5px;margin-bottom:16px;border:1px solid}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.banner.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.banner .spacer{flex:1}

.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.hidden{display:none !important}
.scrolly{max-height:340px;overflow-y:auto}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1,.g-1-2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{
    width:100%;flex:none;height:auto;position:sticky;top:0;z-index:50;
    border-right:0;border-bottom:1px solid var(--rule);padding:10px 0 8px;overflow:visible;
  }
  .brand{padding:0 14px 8px}
  .brand .logo{font-size:21px}
  .navlist{
    flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin-top:0;
    padding:0 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .navlist::-webkit-scrollbar{display:none}
  .navbtn{width:auto;white-space:nowrap;padding:8px 12px;font-size:14px}
  .navsec{display:none}
  .sidefoot{display:none}
  .main{padding:16px 14px 90px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .topbar h1{font-size:23px}
  .card{padding:15px}
  /* wide tables scroll inside their own card, never the page */
  .card.flush{overflow-x:auto}
  table{min-width:540px}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin-bottom:9px}
  .drawer{width:100%}
  .drawer .dhead{padding:14px 16px}
  .drawer .dbody{padding:16px 16px 70px}
  .modal-back{padding:0;align-items:stretch}
  .modal{width:100%;border-radius:0;min-height:100%}
  .modal footer{border-radius:0;position:sticky;bottom:0}
  .field.row2{grid-template-columns:1fr}
  .quotecard{padding:17px}
  .quotecard blockquote{font-size:17px}
  .stat .val{font-size:26px}
  .todoitem .acts{opacity:1}
  .chiprow input[type=text]{max-width:100% !important;width:100%}
  /* banners stack instead of squeezing into columns */
  .banner{flex-direction:column;align-items:flex-start;gap:8px}
  .banner .spacer{display:none}
  .banner .btn{width:100%}
  .topbar .chiprow{width:100%}
  .topbar .chiprow .btn{flex:1}
  #map,.mapfallback{height:320px}
}
/* mobile-only bottom bar for the two things you do most */
.mobilebar{display:none}
@media (max-width:820px){
  .mobilebar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:8px;padding:9px 12px;
    padding-bottom:calc(9px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -3px 14px rgba(0,0,0,.07);
  }
  .mobilebar .btn{flex:1;text-align:center}
}
@media print{
  .sidebar,.btn,.chiprow{display:none !important}
  .main{padding:0}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   1. SEED DATA
   Everything below is the starting point. Edit it in the app (changes
   save to this browser) or edit this block directly to change defaults.
   ===================================================================== */
const SEED = {
  meta: {
    business: "TopKid Events",
    tagline: "Character Development. Unforgettable Summer.",
    owner: "Coach Mike",
    email: "michael@topkidevents.com",
    fyStart: "01",            // fiscal year starts in January
    lastBackup: "",
    homeBase: { name: "", address: "", lat: 0, lng: 0 }
  },

  /* ---------- Cultural values ---------- */
  valueGroups: [
    {
      id: "vg-traits",
      title: "The 6 Character Traits",
      blurb: "One per day, 3–5 minutes each. This is the product and the point.",

const KEY = "topkid.dashboard.v1";
let DB;

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw){ DB = clone(SEED); return; }
    const saved = JSON.parse(raw);
    DB = Object.assign(clone(SEED), saved);        // new seed keys survive upgrades
    DB.settings = Object.assign(clone(SEED.settings), saved.settings||{});
    DB.meta     = Object.assign(clone(SEED.meta),     saved.meta||{});
  }catch(e){
    console.error("Could not read saved data, starting from seed.", e);
    DB = clone(SEED);
  }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ if(SYNC.mode !== "file") toast("Could not save — browser storage may be full or blocked.", "crit"); }
    scheduleFileWrite();
    schedulePush();
  }, 60);
}
function commit(){ save(); render(); }

/* =====================================================================
   2b. FILE SYNC — write straight into a real .json file on disk
   Uses the File System Access API. That API needs a "secure context",
   which a double-clicked file:// page is not — so this lights up only
   when the dashboard is opened through the launcher (localhost) or from
   a hosted URL. When it isn't available we fall back to localStorage +
   the backup nag, and say so plainly.
   ===================================================================== */
const SYNC = { mode:"local", handle:null, name:"", lastWrite:"", error:"",
               supported: typeof window.showSaveFilePicker === "function" };

/* File handles can't live in localStorage — they go in IndexedDB. */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("topkid-sync",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
    r.onsuccess = ()=> res(r.result);
    r.onerror   = ()=> rej(r.error);
  });
}
async function idbGet(k){
  try{ const db = await idbOpen();
    return await new Promise((res,rej)=>{ const q = db.transaction("kv").objectStore("kv").get(k);
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  }catch(e){ return null; }
}
async function idbSet(k,v){
  try{ const db = await idbOpen();
    await new Promise((res,rej)=>{ const q = db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
  }catch(e){}
}
async function idbDel(k){
  try{ const db = await idbOpen();
    await new Promise((res,rej)=>{ const q = db.transaction("kv","readwrite").objectStore("kv").delete(k);
      q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
  }catch(e){}
}

const FILE_TYPES = [{ description:"TopKid dashboard data", accept:{"application/json":[".json"]} }];

/* =====================================================================
   2c. GITHUB SYNC — the private repo is the shared source of truth
   Every save becomes a commit, so any past state can be restored, and
   the Mac / phone / iPad all read the same file.

   SECURITY: the access token is deliberately kept OUT of DB, so it can
   never end up inside data.json and get committed to the repo. It lives
   in its own localStorage key, per device, and is stripped defensively
   before every push.
   ===================================================================== */
const TOKEN_KEY = "topkid.gh.token";
const GH = { mode:"off", sha:"", last:"", error:"", busy:false, pending:false };

function ghCfg(){ return DB.settings.github || (DB.settings.github = {owner:"",repo:"",path:"data.json",branch:"main"}); }
function ghToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } }
function ghSetToken(t){ try{ t ? localStorage.setItem(TOKEN_KEY,t) : localStorage.removeItem(TOKEN_KEY); }catch(e){} }
function ghConfigured(){ const c = ghCfg(); return !!(c.owner && c.repo && c.path && ghToken()); }

/* GitHub wants base64 of UTF-8; chunked so big files don't blow the stack. */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "", CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghApi(path, opts={}){
  const r = await fetch("https://api.github.com" + path, Object.assign({}, opts, {
    headers: Object.assign({
      "Accept":"application/vnd.github+json",
      "Authorization":"Bearer " + ghToken(),
      "X-GitHub-Api-Version":"2022-11-28"
    }, opts.headers||{})
  }));
  if(r.status === 404) return { __missing:true, status:404 };
  if(!r.ok){
    let detail = "";
    try{ detail = (await r.json()).message || ""; }catch(e){}
    const err = new Error(ghErrorText(r.status, detail));
    err.status = r.status;
    throw err;
  }
  return r.json();
}
function ghErrorText(status, msg){
  if(status === 401) return "Token rejected — it may be expired or mistyped.";
  if(status === 403) return "Token lacks permission for this repo (needs Contents: Read and write).";
  if(status === 409 || status === 422) return "Someone else changed the file first.";
  if(status === 404) return "Repo or file path not found — check the owner/repo names.";
  return "GitHub error " + status + (msg ? ": " + msg : "");
}

function ghPayload(){
  const copy = clone(DB);
  if(copy.settings) delete copy.settings.token;   // belt and braces: never ship a token
  copy.meta = copy.meta || {};
  copy.meta.updatedAt = new Date().toISOString();
  copy.meta.updatedBy = deviceName();
  DB.meta.updatedAt = copy.meta.updatedAt;
  return copy;
}
function deviceName(){
  const ua = navigator.userAgent;
  if(/iPhone/.test(ua)) return "iPhone";
  if(/iPad/.test(ua)) return "iPad";
  if(/Android/.test(ua)) return "Android";
  if(/Mac/.test(ua)) return "Mac";
  return "Browser";
}

/* ---------- pull ---------- */
async function ghPull(ref){
  const c = ghCfg();
  const q = "?ref=" + encodeURIComponent(ref || c.branch || "main");
  const j = await ghApi(`/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(c.path)}` + q);
  if(j.__missing) return null;
  if(!ref) GH.sha = j.sha;
  const d = JSON.parse(b64decode(j.content));
  if(!d || typeof d !== "object" || !("schools" in d)) throw new Error("That file isn't dashboard data.");
  return d;
}

/* ---------- push ---------- */
async function ghPush(message){
  const c = ghCfg();
  const body = {
    message: message || ("Dashboard update from " + deviceName() + " · " + new Date().toLocaleString("en-US")),
    content: b64encode(JSON.stringify(ghPayload(), null, 2)),
    branch: c.branch || "main"
  };
  if(GH.sha) body.sha = GH.sha;
  const j = await ghApi(`/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(c.path)}`,
                        { method:"PUT", body: JSON.stringify(body) });
  GH.sha = j.content.sha;
  GH.last = new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  return j;
}

function adopt(d){
  DB = Object.assign(clone(SEED), d);
  DB.settings = Object.assign(clone(SEED.settings), d.settings||{});
  DB.meta     = Object.assign(clone(SEED.meta),     d.meta||{});
}

/* ---------- boot / manual sync ---------- */
async function ghSync(opts={}){
  if(!ghConfigured()){ GH.mode = "off"; return; }
  if(GH.busy){ GH.pending = true; return; }
  GH.busy = true; GH.mode = "syncing"; GH.error = ""; renderSidebar();
  try{
    const remote = await ghPull();
    if(!remote){                                   // first ever push
      await ghPush("Create dashboard data");
      GH.mode = "ready";
    } else {
      const rT = remote.meta && remote.meta.updatedAt || "";
      const lT = DB.meta.updatedAt || "";
      if(opts.force === "local"){ await ghPush("Overwrite from " + deviceName()); GH.mode = "ready"; }
      else if(opts.force === "remote"){ adopt(remote); saveLocalOnly(); GH.mode = "ready"; }
      else if(rT && lT && rT > lT && opts.dirty){   // both changed — real conflict
        GH.mode = "conflict"; GH.busy = false;
        renderSidebar(); showConflict(remote); return;
      }
      else if(rT > lT){ adopt(remote); saveLocalOnly(); GH.mode = "ready"; }
      else if(lT > rT){ await ghPush(); GH.mode = "ready"; }
      else GH.mode = "ready";
    }
    GH.last = GH.last || new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  }catch(e){
    GH.mode = "error"; GH.error = e.message;
  }
  GH.busy = false;
  render();
  if(GH.pending){ GH.pending = false; schedulePush(); }
}

function saveLocalOnly(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
}

let ghTimer = null;
function schedulePush(){
  if(!ghConfigured()) return;
  clearTimeout(ghTimer);
  GH.mode = GH.mode === "error" ? "error" : "pending";
  renderSidebar();
  ghTimer = setTimeout(async ()=>{
    if(GH.busy){ GH.pending = true; return; }
    GH.busy = true; GH.mode = "syncing"; GH.error = ""; renderSidebar();
    try{ await ghPush(); GH.mode = "ready"; }
    catch(e){
      if(e.status === 409 || e.status === 422){    // remote moved under us
        GH.busy = false;
        try{ const remote = await ghPull(); GH.mode = "conflict"; renderSidebar(); showConflict(remote); return; }
        catch(e2){ GH.mode = "error"; GH.error = e2.message; }
      } else { GH.mode = "error"; GH.error = e.message; }
    }
    GH.busy = false; renderSidebar();
    if(GH.pending){ GH.pending = false; schedulePush(); }
  }, 3500);
}

/* ---------- conflict ---------- */

            </div>
          </div>

        <footer>

          <button class="btn" data-act="conflict-remote">Use the other device's</button>
          <button class="btn primary" data-act="conflict-local">Keep this device's</button>
        </footer>
      </div>
    </div>`);
}

/* ---------- version history ---------- */
async function ghHistory(){
  const c = ghCfg();
  return ghApi(`/repos/${c.owner}/${c.repo}/commits?path=${encodeURIComponent(c.path)}&sha=${encodeURIComponent(c.branch||"main")}&per_page=30`);
}

async function syncConnectNew(){
  if(!SYNC.supported) return toast("Open the dashboard through the launcher to use this.","crit");
  try{
    const handle = await window.showSaveFilePicker({ suggestedName:"TopKid-Data.json", types:FILE_TYPES });
    SYNC.handle = handle; SYNC.name = handle.name; SYNC.mode = "file"; SYNC.error = "";
    await idbSet("handle", handle);
    await writeDataFile();
    DB.meta.lastBackup = todayISO();
    commit();
    toast("Connected. Every change now writes to " + handle.name + ".");
  }catch(e){ if(e.name !== "AbortError"){ SYNC.error = e.message; toast("Couldn't connect that file.","crit"); } }
}

async function syncOpenExisting(){
  if(!SYNC.supported) return toast("Open the dashboard through the launcher to use this.","crit");
  try{
    const [handle] = await window.showOpenFilePicker({ types:FILE_TYPES, multiple:false });
    if(await handle.requestPermission({mode:"readwrite"}) !== "granted")
      return toast("Write permission is needed to keep the file in sync.","crit");
    const txt = await (await handle.getFile()).text();
    const d = JSON.parse(txt);
    if(!d || typeof d !== "object" || !("schools" in d)) throw new Error("not a dashboard file");
    DB = Object.assign(clone(SEED), d);
    DB.settings = Object.assign(clone(SEED.settings), d.settings||{});
    DB.meta     = Object.assign(clone(SEED.meta),     d.meta||{});
    SYNC.handle = handle; SYNC.name = handle.name; SYNC.mode = "file"; SYNC.error = "";
    await idbSet("handle", handle);
    commit();
    toast("Loaded " + handle.name + " — now kept in sync.");
  }catch(e){ if(e.name !== "AbortError") toast("That file isn't a dashboard data file.","crit"); }
}

async function syncReconnect(){
  if(!SYNC.handle) return;
  try{
    if(await SYNC.handle.requestPermission({mode:"readwrite"}) === "granted"){
      SYNC.mode = "file"; await restoreFromFile(); toast("Reconnected to " + SYNC.name + ".");
    }
  }catch(e){ SYNC.error = e.message; renderSidebar(); }
}

async function syncDisconnect(){
  await idbDel("handle");
  SYNC.handle = null; SYNC.name = ""; SYNC.mode = "local"; SYNC.lastWrite = "";
  commit(); toast("Disconnected. Back to browser-only storage.");
}

let fileTimer = null;
function scheduleFileWrite(){
  if(SYNC.mode !== "file" || !SYNC.handle) return;
  clearTimeout(fileTimer);
  fileTimer = setTimeout(writeDataFile, 900);
}
async function writeDataFile(){
  if(!SYNC.handle) return;
  try{
    const w = await SYNC.handle.createWritable();
    await w.write(JSON.stringify(DB,null,2));
    await w.close();
    SYNC.lastWrite = new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    SYNC.error = "";
  }catch(e){
    SYNC.error = e.message;
    if(e.name === "NotAllowedError") SYNC.mode = "needs-permission";
  }
  renderSidebar();
}

/* On boot: if a file was connected before, the FILE is the source of truth. */
async function restoreFromFile(){
  if(!SYNC.supported) return;
  const handle = await idbGet("handle");
  if(!handle) return;
  SYNC.handle = handle; SYNC.name = handle.name;
  let perm = "prompt";
  try{ perm = await handle.queryPermission({mode:"readwrite"}); }catch(e){}
  if(perm !== "granted"){ SYNC.mode = "needs-permission"; renderSidebar(); return; }
  try{
    const txt = await (await handle.getFile()).text();
    if(txt.trim()){
      const d = JSON.parse(txt);
      if(d && typeof d === "object" && "schools" in d){
        DB = Object.assign(clone(SEED), d);
        DB.settings = Object.assign(clone(SEED.settings), d.settings||{});
        DB.meta     = Object.assign(clone(SEED.meta),     d.meta||{});
      }
    }
    SYNC.mode = "file"; SYNC.error = "";
  }catch(e){ SYNC.error = e.message; }
  render();
}

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function uid(p){ return p + "-" + Math.random().toString(36).slice(2,9); }
function h(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n, cents=false){
  n = Number(n)||0;
  return "$" + n.toLocaleString("en-US",{minimumFractionDigits:cents?2:0, maximumFractionDigits:cents?2:0});
}
function moneyShort(n){
  n = Number(n)||0;
  if(Math.abs(n) >= 1000000) return "$" + (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if(Math.abs(n) >= 1000)    return "$" + (n/1000).toFixed(1).replace(/\.0$/,"") + "k";
  return "$" + Math.round(n);
}
function fmtMetric(v,u){
  if(u === "$") return money(v);
  if(u === "%" || u === "% full") return (Math.round(v*10)/10) + "%";
  return (Number(v)||0).toLocaleString("en-US") + (u ? " " + u : "");
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseISO(s){ if(!s) return null; const p=String(s).split("-").map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function fmtDate(s,long){
  const d = parseISO(s); if(!d || isNaN(d)) return "";
  return long ? d.toLocaleDateString("en-US",{weekday:"short",month:"long",day:"numeric",year:"numeric"})
              : MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}
function fmtDateShort(s){ const d=parseISO(s); return d&&!isNaN(d) ? MONTHS[d.getMonth()]+" "+d.getDate() : ""; }
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function daysUntil(s){ const d=parseISO(s); if(!d||isNaN(d)) return null; return Math.round((d-today0())/86400000); }
function relDays(s){
  const n = daysUntil(s); if(n===null) return "";
  if(n === 0)  return "today";
  if(n === 1)  return "tomorrow";
  if(n === -1) return "yesterday";
  if(n < 0)    return Math.abs(n) + " days ago";
  if(n < 45)   return "in " + n + " days";
  return "in " + Math.round(n/30) + " months";
}

/* =====================================================================
   3b. ADDRESS → MAP PIN
   A map is a coordinate grid, so an address has to be turned into
   lat/lng before it can be drawn. That translation lives in a database,
   not a formula — we ask OpenStreetMap's public one. No key, no account.
   It needs internet, and it is rate-limited to ~1 request/second, so the
   bulk pass below is deliberately slow. Typing coordinates by hand still
   works and is always the fallback.
   ===================================================================== */
function hasPin(s){ return isFinite(s.lat) && isFinite(s.lng) && (Number(s.lat) || Number(s.lng)); }
function addressQuery(d, name){
  const street = [d.address, d.city, d.state, d.zip].map(x=>String(x||"").trim()).filter(Boolean);
  if(String(d.address||"").trim()) return street.join(", ");
  // no street address — a school name plus its town usually resolves anyway
  const byName = [name, d.city, d.state].map(x=>String(x||"").trim()).filter(Boolean);
  return byName.length > 1 ? byName.join(", ") : street.join(", ");
}
async function geocode(q){
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + encodeURIComponent(q);
  let r;
  try{ r = await fetch(url, {headers:{Accept:"application/json"}}); }
  catch(e){ throw new Error("Couldn't reach the lookup service — check your internet."); }
  if(!r.ok) throw new Error("Lookup service returned " + r.status);
  const j = await r.json();
  if(!j.length) throw new Error("No match for that address");
  return { lat:+Number(j[0].lat).toFixed(5), lng:+Number(j[0].lon).toFixed(5), label:j[0].display_name || q };
}
/* Tries the most precise thing first and falls back. A street address can be
   mistyped or simply missing from the map data, while schools themselves are
   usually tagged by name — so the name is a genuinely good second try. The
   last resort is the town centre, which gets flagged approximate rather than
   pretending to be exact. */
async function geocodeSchool(d){
  const clean = x => String(x||"").trim();
  const attempts = [];
  if(clean(d.address)) attempts.push({ q:[d.address,d.city,d.state,d.zip].map(clean).filter(Boolean).join(", "), approx:false, how:"street address" });
  const byName = [d.name,d.city,d.state].map(clean).filter(Boolean);
  if(clean(d.name) && byName.length>1) attempts.push({ q:byName.join(", "), approx:false, how:"school name" });
  const town = [d.city,d.state].map(clean).filter(Boolean);
  if(town.length) attempts.push({ q:town.join(", "), approx:true, how:"town centre" });
  if(!attempts.length) throw new Error("Nothing to look up — add an address, or a city");
  let last;
  for(let i=0;i<attempts.length;i++){
    try{ return Object.assign(await geocode(attempts[i].q), {approx:attempts[i].approx, how:attempts[i].how}); }
    catch(e){ last = e; if(i < attempts.length-1) await new Promise(r=>setTimeout(r,1200)); }
  }
  throw last;
}
async function placeOne(s, quiet){
  try{
    const r = await geocodeSchool(s);
    s.lat = r.lat; s.lng = r.lng; s.approx = r.approx;
    commit();
    if(!quiet) toast("Placed " + s.name + " on the map" + (r.approx ? " — town centre only, so the pin is approximate." : " from its " + r.how + "."));
    if(UI.selected === s.id && $(".drawer")) openSchool(s.id);
    return true;
  }catch(e){ if(!quiet) toast(e.message + " — you can type the coordinates by hand instead.","crit"); return false; }
}
async function placeAllMissing(){
  const list = DB.schools.filter(s=>!hasPin(s));
  if(!list.length) return toast("Every school is already on the map.");
  toast("Looking up " + list.length + " address" + (list.length>1?"es":"") + "… about " + Math.ceil(list.length*1.2) + "s.");
  let ok=0, fail=0;
  for(let i=0;i<list.length;i++){
    if(await placeOne(list[i], true)) ok++; else fail++;
    if(i < list.length-1) await new Promise(r=>setTimeout(r,1200));  // respect the 1/sec limit
    if(fail >= 4 && ok === 0){ toast("Lookups are all failing — stopping. Check your internet.","crit"); break; }
  }
  commit();
  toast(ok + " placed" + (fail ? ", " + fail + " couldn't be found — add those by hand" : "") + ".");
}

    case "textarea": input = `<textarea name="${f.key}" placeholder="${h(f.placeholder||"")}">${h(val)}</textarea>`; break;
    case "select":
      input = `<select name="${f.key}">` + f.options.map(o=>{
        const ov = typeof o==="string" ? o : o.value, ol = typeof o==="string" ? (o||"—") : o.label;
        return `<option value="${h(ov)}"${String(ov)===String(val)?" selected":""}>${h(ol)}</option>`;
      }).join("") + `</select>`; break;
    case "checks":
      input = `<div class="checkrow">` + f.options.map(o=>
        `<label><input type="checkbox" name="${f.key}" value="${h(o)}"${(Array.isArray(val)&&val.includes(o))?" checked":""}> ${h(o)}</label>`).join("") + `</div>`; break;
    case "geo": input = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">

    case "number": input = `<input type="number" name="${f.key}" value="${h(val)}" step="${f.step||"any"}" placeholder="${h(f.placeholder||"")}">`; break;
    case "date":   input = `<input type="date" name="${f.key}" value="${h(val)}">`; break;
    case "month":  input = `<input type="month" name="${f.key}" value="${h(String(val).slice(0,7))}">`; break;
    default:       input = `<input type="${f.type||"text"}" name="${f.key}" value="${h(val)}" placeholder="${h(f.placeholder||"")}">`;

}

/* =====================================================================
   5. CHARTS  (hand-rolled SVG — no chart library, works offline)
   Palette: series-1 purple / series-2 green. Validated for colour-vision
   deficiency and contrast in both light and dark mode. Every chart also
   ships a legend + a table view, so identity is never colour alone.
   ===================================================================== */
function niceMax(v){
  if(v <= 0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return step * mag;
}
function tip(obj){ return `data-tip='${h(JSON.stringify(obj))}'`; }

/* Grouped vertical bars. series = [{name, color, values:[]}] */
function groupedBars(categories, series, opts={}){
  const W = opts.width||760, H = opts.height||260;
  const padL = 52, padR = 12, padT = 18, padB = 30;
  const iw = W-padL-padR, ih = H-padT-padB;
  const maxV = niceMax(Math.max(1, ...series.flatMap(s=>s.values)));
  const n = Math.max(1, categories.length);
  const groupW = iw / n;
  const inner = Math.min(groupW - 10, 64);
  const gap = 2;
  const barW = Math.max(3, (inner - gap*(series.length-1)) / series.length);
  const y = v => padT + ih - (v/maxV)*ih;
  const ticks = [0, .25, .5, .75, 1].map(f=>f*maxV);
  const fmt = opts.fmt || moneyShort;

  let g = "";
  ticks.forEach(t=>{
    g += `<line x1="${padL}" x2="${W-padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${t===0?"0":fmt(t)}</text>`;
  });
  categories.forEach((c,i)=>{
    const cx = padL + groupW*i + groupW/2;
    g += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${h(c)}</text>`;
    series.forEach((s,si)=>{
      const v = s.values[i]||0;
      const bx = cx - inner/2 + si*(barW+gap);
      const bh = Math.max(v>0?2:0, padT+ih - y(v));
      if(bh>0) g += `<rect x="${bx.toFixed(1)}" y="${y(v).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${s.color}" ${tip({t:c, rows:[[s.name, fmt(v)]]})} style="cursor:default"/>`;
    });
    if(categories.length <= 8){
      const tot = sum(series, s=>s.values[i]||0);
      if(tot>0) g += `<text x="${cx.toFixed(1)}" y="${(y(tot)-6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-2)">${fmt(tot)}</text>`;
    }
  });
  g += `<line x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}" stroke="var(--rule-strong)" stroke-width="1"/>`;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.max(320, n*46)}px;height:auto;font-family:'DM Sans',sans-serif" role="img" aria-label="${h(opts.aria||"Bar chart")}">${g}</svg></div>`;
}

/* One horizontal 100% bar: share of total by product. 2px surface gaps. */
function shareBar(parts, opts={}){
  const total = sum(parts, p=>p.value);
  if(total <= 0) return `<div class="empty small">No revenue recorded yet.</div>`;
  const W = 760, H = 46, gap = 2;
  let x = 0, g = "";
  parts.forEach((p,i)=>{
    const w = (p.value/total)*W - (i<parts.length-1 ? gap : 0);
    if(w > 0.5){
      g += `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" rx="4" fill="${p.color}" ${tip({t:p.name, rows:[[money(p.value), Math.round(p.value/total*100)+"%"]]})}/>`;
      if(w > 92) g += `<text x="${(x+10).toFixed(1)}" y="27" font-size="13" font-weight="700" fill="#fff">${Math.round(p.value/total*100)}%</text>`;
    }
    x += (p.value/total)*W;
  });
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:46px" role="img" aria-label="Share of revenue by product">${g}</svg></div>`;
}

function sparkline(values, color){
  if(!values || values.length < 2) return `<div class="sparkwrap small muted" style="display:flex;align-items:center">No history yet</div>`;
  const W=170,H=34,p=5;
  const mn=Math.min(...values), mx=Math.max(...values), rng=(mx-mn)||1;
  const pts = values.map((v,i)=>[ p + i*(W-2*p)/(values.length-1), H-p - ((v-mn)/rng)*(H-2*p) ]);
  const d = pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<div class="sparkwrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:34px">
    <path d="${d}" fill="none" stroke="${color||"var(--series-1)"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${color||"var(--series-1)"}" stroke="var(--surface)" stroke-width="2"/>
  </svg></div>`;
}

function legendHTML(series){

}

/* Chart tooltip (single floating node) */
(function(){
  let node=null;
  document.addEventListener("mouseover", e=>{
    const t = e.target.closest("[data-tip]"); if(!t) return;
    let d; try{ d = JSON.parse(t.getAttribute("data-tip")); }catch(_){ return; }
    node = document.createElement("div"); node.className="tip";
    node.innerHTML = `<b>${h(d.t)}</b>` + (d.rows||[]).map(r=>`<div class="r"><span>${h(r[0])}</span><span>${h(r[1])}</span></div>`).join("");
    document.body.appendChild(node);
    move(e);
  });
  document.addEventListener("mousemove", e=>{ if(node) move(e); });
  document.addEventListener("mouseout", e=>{ if(e.target.closest("[data-tip]") && node){ node.remove(); node=null; } });
  function move(e){
    const r = node.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY - r.height - 10;
    if(x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if(y < 8) y = e.clientY + 18;
    node.style.left = x+"px"; node.style.top = y+"px";
  }
})();

/* Parses "!" for priority and today/tomorrow/mon-fri for a due date */
function parseQuickTodo(raw){
  let s = raw.trim(), priority="med", due="";
  if(/(^|\s)!!?($|\s)/.test(s) || s.includes("!")){ priority="high"; s = s.replace(/!+/g,"").trim(); }
  const low = s.toLowerCase();
  const d = new Date();
  if(/\btoday\b/.test(low)){ due = todayISO(); s = s.replace(/\btoday\b/i,"").trim(); }
  else if(/\btomorrow\b/.test(low)){ d.setDate(d.getDate()+1); due = iso(d); s = s.replace(/\btomorrow\b/i,"").trim(); }
  else {
    const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    for(let i=0;i<7;i++){
      if(new RegExp("\\b"+days[i]+"\\b").test(low)){
        const delta = ((i - d.getDay()) + 7) % 7 || 7;
        d.setDate(d.getDate()+delta); due = iso(d);
        s = s.replace(new RegExp("\\b"+days[i]+"\\b","i"),"").trim();
        break;
      }
    }
  }
  s = s.replace(/\s{2,}/g," ").replace(/^[-*•\s]+/,"").trim();
  return { title:s, priority, due };
}
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  DB.todos.unshift(Object.assign({ id:uid("t"), title:"", notes:"", area:"Ops", priority:"med",

}

/* ---------- Map ---------- */
let _map = null, _layer = null;
function initMap(){
  const el = document.getElementById("map");
  if(!el) return;
  const pts = filteredSchools().filter(hasPin);
  const base = DB.meta.homeBase;

  if(typeof L === "undefined"){ return fallbackMap(el, pts, base); }

  el.innerHTML = "";
  if(_map){ _map.remove(); _map = null; }
  _map = L.map(el, { scrollWheelZoom:false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom:18, attribution:"© OpenStreetMap contributors" }).addTo(_map);
  _layer = L.layerGroup().addTo(_map);

  const bounds = [];
  pts.forEach(s=>{
    const st = statusMeta(s.status);
    const icon = L.divIcon({ className:"", iconSize:[18,18], iconAnchor:[9,9], html:
      `<span style="display:block;width:16px;height:16px;border-radius:50%;background:${st.pin};
        border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);${s.approx?"opacity:.72":""}"></span>` });
    const m = L.marker([s.lat,s.lng],{icon}).addTo(_layer);
    m.bindPopup(`<b>${h(s.name)}</b><br><span style="color:${st.pin}">${h(st.label)}</span>
       ${s.tier?" · "+h(s.tier):""}<br>${h(s.district||"")}${s.approx?"<br><i>approximate location</i>":""}
       <br><a href="#" onclick="openSchool('${s.id}');return false;">Open details →</a>`);
    bounds.push([s.lat,s.lng]);
  });
  if(base && base.lat){
    const icon = L.divIcon({ className:"", iconSize:[18,18], iconAnchor:[9,9], html:
      `<span style="display:block;width:15px;height:15px;border-radius:3px;background:#c727d5;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></span>` });
    L.marker([base.lat,base.lng],{icon}).addTo(_layer)
      .bindPopup(`<b>${h(base.name)}</b><br>${h(base.address)}`);
    bounds.push([base.lat,base.lng]);
  }
  if(bounds.length) _map.fitBounds(bounds, { padding:[40,40], maxZoom:12 });
  else _map.setView([40.03,-83.0],10);
  setTimeout(()=>_map.invalidateSize(), 120);
}

/* Offline / blocked-CDN fallback: plot the same points on a plain grid */
function fallbackMap(el, pts, base){
  const all = pts.concat(base && base.lat ? [{lat:base.lat,lng:base.lng,name:base.name,status:"base"}] : []);
  if(!all.length){ el.outerHTML = `<div class="mapfallback"><div class="empty">Add a school with coordinates to see the map.</div></div>`; return; }
  const lats = all.map(p=>p.lat), lngs = all.map(p=>p.lng);
  const pad = 0.02;
  const minLat=Math.min(...lats)-pad, maxLat=Math.max(...lats)+pad;
  const minLng=Math.min(...lngs)-pad, maxLng=Math.max(...lngs)+pad;
  const W=760,H=430,m=34;
  const X = v => m + (v-minLng)/((maxLng-minLng)||1) * (W-2*m);
  const Y = v => H-m - (v-minLat)/((maxLat-minLat)||1) * (H-2*m);
  let g = `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--surface-2)"/>`;
  for(let i=0;i<=4;i++){
    const x = m + i*(W-2*m)/4, y = m + i*(H-2*m)/4;
    g += `<line x1="${x}" y1="${m}" x2="${x}" y2="${H-m}" stroke="var(--grid)"/>`;
    g += `<line x1="${m}" y1="${y}" x2="${W-m}" y2="${y}" stroke="var(--grid)"/>`;
  }
  all.forEach(p=>{
    const c = p.status==="base" ? "#c727d5" : statusMeta(p.status).pin;
    g += `<circle cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="7" fill="${c}" stroke="var(--surface)" stroke-width="2"
            ${p.id?`data-act="school-open" data-id="${p.id}" style="cursor:pointer"`:""} ${tip({t:p.name,rows:[["",""]]})}/>`;
  });
  el.outerHTML = `<div class="mapfallback">
      <div class="banner warn" style="margin:12px 14px 0">Map tiles couldn't load (no internet). Showing a plain coordinate plot instead — everything else works normally.</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg></div>`;
}

function viewCalendar(){
  const items = DB.dates.map(d=>Object.assign({kind:"date"},d))
    .concat(DB.milestones.map(m=>({kind:"milestone", id:m.id, date:m.date, title:m.title, type:"Milestone", detail:m.detail, done:m.done})))
    .concat(DB.campWeeks.map(w=>({kind:"camp", id:w.id, date:w.start, title:`Summer Camp — ${w.name} (${fmtDateShort(w.start)}–${fmtDateShort(w.end)})`, type:"Camp", detail:""})));
  const upcoming = sortBy(items.filter(i=>daysUntil(i.date) >= 0), i=>i.date);
  const past     = sortBy(items.filter(i=>daysUntil(i.date) < 0), i=>i.date).reverse();

function autoMetric(m){
  switch(m.auto){
    case "touchesThisMonth": return touchesThisMonth();
    case "schoolsRun":       return DB.schools.filter(s=>["client","past"].includes(s.status)).length;
    case "winRate": {
      const contacted = DB.schools.filter(s=>s.status!=="target").length;
      const booked = DB.schools.filter(s=>["booked","client","past"].includes(s.status)).length;
      return contacted ? Math.round(booked/contacted*100) : 0;
    }
    case "campWeeks":        return DB.campWeeks.length;
  }
  return null;
}

function download(name, text, type){
  const blob = new Blob([text], {type: type||"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function backupAgeDays(){
  if(!DB.meta.lastBackup) return null;
  const n = daysUntil(DB.meta.lastBackup);
  return n===null ? null : Math.abs(n);
}
function backupStale(){ const a = backupAgeDays(); return a===null || a > 14; }
function exportJSON(){
  DB.meta.lastBackup = todayISO();
  download(`topkid-dashboard-${todayISO()}.json`, JSON.stringify(DB,null,2));
  save(); renderSidebar();
  toast("Backup downloaded. Move it into your TopKid Business Folder.");
}
function importJSON(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d || typeof d!=="object" || !("schools" in d)) throw new Error("Not a dashboard backup");
        DB = Object.assign(clone(SEED), d);
        commit(); toast("Backup loaded.");
      }catch(e){ toast("That file isn't a dashboard backup.", "crit"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

    ],

    deleteFn: isNew ? null : ()=>{ DB.schools = DB.schools.filter(x=>x.id!==s.id); commit(); },
    onSave: d=>{
      d.tags = d.tags ? d.tags.split(",").map(t=>t.trim()).filter(Boolean) : [];
      const before = {lat:s.lat, lng:s.lng};
      const rec = Object.assign({}, s, d);
      if(Number(d.lat)!==Number(before.lat) || Number(d.lng)!==Number(before.lng)) rec.approx = false;
      if(!hasPin(rec)) rec.approx = false;
      rec.outreach = s.outreach || [];
      if(isNew) DB.schools.push(rec);
      else Object.assign(school(s.id), rec);
      commit();
      if(UI.selected===rec.id) openSchool(rec.id);
      // saved without a pin but with an address? place it without being asked.
      if(!hasPin(rec) && addressQuery(rec, rec.name).trim()){
        const live = school(rec.id);
        if(live){
          toast("Finding " + live.name + " on the map…");
          placeOne(live, true).then(done=>{
            toast(done ? "Placed " + live.name + " on the map."
                       : live.name + " saved, but that address didn't resolve — add coordinates by hand.");
          });
        }
      }
    }
  });

async function showHistory(){
  openOverlay(`<div class="modal-back" data-act="backdrop"><div class="modal">
    <header><h3>Version history</h3><button class="btn ghost sm" data-act="close">Close</button></header>
    <div class="body"><div class="empty">Loading commits…</div></div></div></div>`);
  try{
    const commits = await ghHistory();
    const rows = (commits||[]).map(c=>{
      const d = new Date(c.commit.author.date);
      return `<tr><td>${h(d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))}
          <div class="small muted">${h((c.commit.message||"").slice(0,60))}</div></td>
        <td style="width:150px" class="nowrap">
          <button class="btn sm ghost" data-act="gh-preview" data-sha="${h(c.sha)}">Preview</button>
          <button class="btn sm ghost" data-act="gh-restore" data-sha="${h(c.sha)}">Restore</button></td></tr>`;
    }).join("");
    $(".modal .body").innerHTML = rows
      ? `<p class="small" style="margin:0">Every save is a commit. Restoring brings a past version back as a new commit — nothing gets erased.</p>
         <div class="card flush"><table><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">No commits yet.</div>`;
  }catch(e){
    $(".modal .body").innerHTML = `<div class="banner warn">${h(e.message)}</div>`;
  }
}

    toast(`That version: ${(d.schools||[]).length} schools · ${(d.todos||[]).length} to-dos · ${(d.revenue||[]).length} revenue rows`);

function restoreVersion(sha){
  confirmModal("Restore this version",
    "The current state is already saved as its own commit, so this is reversible.",
    async ()=>{
      try{
        const d = await ghPull(sha);
        adopt(d);
        DB.meta.updatedAt = new Date().toISOString();
        saveLocalOnly();
        await ghPush("Restore earlier version " + sha.slice(0,7));
        render(); toast("Restored.");
      }catch(e){ toast(e.message,"crit"); }
    }, "Restore");
}

   19. EVENTS
   ===================================================================== */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]"); if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;

  /* backdrop only closes when the backdrop itself was clicked */
  if(act === "backdrop"){ if(e.target === t) closeOverlay(); return; }
  if(act === "quickadd-form") return;
  e.preventDefault();

  switch(act){
    case "go": go(t.dataset.view); break;
    case "close": closeOverlay(); break;
    case "confirm-yes": { const f=_confirmYes; closeOverlay(); if(f) f(); break; }
    case "form-delete": { const f=_formDelete; closeOverlay(); if(f) confirmModal("Delete this?","This can't be undone.",f); break; }
    case "print": window.print(); break;
    case "theme": {
      const cur = document.documentElement.getAttribute("data-theme") || "auto";
      const next = cur==="auto" ? "light" : cur==="light" ? "dark" : "auto";
      if(next==="auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      DB.settings.theme = next; save(); toast("Theme: "+next);
      if(UI.view==="schools") setTimeout(initMap,60);
      break;
    }
    case "toggle-table": UI.showTable[t.dataset.key] = !UI.showTable[t.dataset.key]; render(); break;

    /* quotes */
    case "quote-next": DB.settings.lastQuote = ((DB.settings.lastQuote||0)+1) % Math.max(1,DB.quotes.length); commit(); break;
    case "quote-show": DB.settings.lastQuote = Number(t.dataset.i)||0; commit(); break;
    case "quote-add": formQuote(null); break;
    case "quote-edit": formQuote(DB.quotes.find(q=>q.id===id)); break;
    case "quote-del": confirmModal("Delete quote","Remove this quote from the rotation?",()=>{
        DB.quotes = DB.quotes.filter(q=>q.id!==id); commit(); }); break;

    /* to-dos */
    case "todo-new": formTodo(null, t.dataset.school); break;
    case "todo-quick": go("todos"); setTimeout(()=>{ const q=$("#qa"); if(q) q.focus(); },40); break;
    case "todo-edit": formTodo(DB.todos.find(x=>x.id===id)); break;
    case "todo-del": DB.todos = DB.todos.filter(x=>x.id!==id); commit(); break;
    case "todo-toggle": { const x = DB.todos.find(y=>y.id===id);
        x.status = x.status==="done" ? "open" : "done";
        x.completedAt = x.status==="done" ? todayISO() : "";
        save(); render(); if(UI.selected && $(".drawer")) openSchool(UI.selected); break; }
    case "todo-filter": UI.todoFilter = t.dataset.v; render(); break;
    case "todo-area":   UI.todoArea   = t.dataset.v; render(); break;
    case "todo-dump": formBrainDump(); break;
    case "todo-clear-done": confirmModal("Clear completed","Remove every completed to-do?",()=>{
        DB.todos = DB.todos.filter(x=>x.status!=="done"); commit(); }, "Clear"); break;

    /* schools & outreach */
    case "geo-find": {
      const form = $("#theform"); if(!form) break;
      const get = n => { const el = form.querySelector(`[name="${n}"]`); return el ? el.value : ""; };
      const st = $("#geostatus");
      const cur = UI._formSchoolId ? (school(UI._formSchoolId)||{}) : {};
      const d = { name:get("name")||cur.name, address:get("address")||cur.address, city:get("city")||cur.city,
                  state:get("state")||cur.state, zip:get("zip")||cur.zip };
      if(!String(d.address||"").trim() && !String(d.city||"").trim()){
        st.textContent = "Type an address, or at least a city, first."; st.style.color = "var(--crit)"; break; }
      st.textContent = "Looking up…"; st.style.color = "var(--muted)";
      geocodeSchool(d).then(r=>{
        form.querySelector('[name="lat"]').value = r.lat;
        form.querySelector('[name="lng"]').value = r.lng;
        st.textContent = (r.approx ? "≈ town centre only — " : "✓ matched by " + r.how + " — ")
                       + (r.label.length>64 ? r.label.slice(0,64)+"…" : r.label);
        st.style.color = r.approx ? "var(--warn)" : "var(--good)";
      }).catch(e=>{ st.textContent = "✕ " + e.message + " — type the coordinates by hand instead."; st.style.color = "var(--crit)"; });
      break;
    }
    case "geo-one": placeOne(school(id)); break;
    case "geo-all": placeAllMissing(); break;
    case "school-new": formSchool(null); break;
    case "school-edit": formSchool(school(id)); break;
    case "school-open": openSchool(id); break;
    case "school-del": { const s=school(id); confirmModal("Delete "+(s?s.name:"school"),
        "This removes the school and its outreach history.", ()=>{
          DB.schools = DB.schools.filter(x=>x.id!==id); UI.selected=null; closeOverlay(); commit(); }); break; }
    case "school-filter": UI.schoolFilter = t.dataset.v; render(); break;
    case "touch-add": formTouch(id || t.dataset.school); break;
    case "touch-del": { const s=school(id);
        s.outreach = s.outreach.filter(o=>o.id!==t.dataset.tid); save(); openSchool(id); renderSidebar(); break; }

    /* money */
    case "rev-add": formRevenue(null, t.dataset.school); break;
    case "rev-edit": formRevenue(DB.revenue.find(x=>x.id===id)); break;
    case "rev-year": UI.revYear = t.dataset.v; render(); break;
    case "exp-add": formExpense(); break;
    case "exp-del": DB.expenses = DB.expenses.filter(x=>x.id!==id); commit(); break;
    case "camp-new": formCamp(null); break;
    case "camp-edit": formCamp(DB.campWeeks.find(x=>x.id===id)); break;

    /* dates, goals, metrics */
    case "date-new": formDate(null, t.dataset.school); break;
    case "date-edit": formDate(DB.dates.find(x=>x.id===id)); break;
    case "ms-new": formMilestone(null); break;
    case "ms-edit": formMilestone(DB.milestones.find(x=>x.id===id)); break;
    case "ms-toggle": { const m=DB.milestones.find(x=>x.id===id); m.done=!m.done; commit(); break; }
    case "goal-new": formGoal(null); break;
    case "goal-edit": formGoal(DB.goals.find(x=>x.id===id)); break;
    case "metric-new": formMetric(null); break;
    case "metric-edit": formMetric(DB.metrics.find(x=>x.id===id)); break;

    /* culture */
    case "vgroup-new": formValueGroup(null); break;
    case "vgroup-edit": formValueGroup(DB.valueGroups.find(x=>x.id===id)); break;
    case "value-new": formValue(id, null); break;
    case "value-edit": { const g=DB.valueGroups.find(x=>x.id===t.dataset.g);
        formValue(t.dataset.g, g.items.find(v=>v.id===id)); break; }
    case "meta-edit": formMeta(); break;
    case "win-add": formWin(); break;
    case "win-del": DB.wins = DB.wins.filter(w=>w.id!==id); commit(); break;

    /* data */
    case "gh-setup": formGitHub(); break;
    case "gh-sync": ghSync(); break;
    case "gh-history": showHistory(); break;
    case "gh-preview": previewVersion(t.dataset.sha); break;
    case "gh-restore": closeOverlay(); restoreVersion(t.dataset.sha); break;
    case "gh-forget": confirmModal("Sign out of this device",
        "Removes the token from this browser only. The repo and its history are untouched.",
        ()=>{ ghSetToken(""); GH.mode="off"; GH.error=""; commit(); toast("Token removed from this device."); }, "Sign out"); break;
    case "conflict-local":  closeOverlay(); ghSync({force:"local"});  break;
    case "conflict-remote": closeOverlay(); ghSync({force:"remote"}); break;
    case "conflict-download": {
      download(`topkid-this-device-${todayISO()}.json`, JSON.stringify(DB,null,2));
      if(_conflictRemote) setTimeout(()=>download(`topkid-other-device-${todayISO()}.json`, JSON.stringify(_conflictRemote,null,2)), 500);
      toast("Both versions downloaded."); break;
    }
    case "sync-connect": syncConnectNew(); break;
    case "sync-open": syncOpenExisting(); break;
    case "sync-reconnect": syncReconnect(); break;
    case "sync-disconnect": confirmModal("Disconnect the data file",
        "The dashboard goes back to saving only in this browser. The file itself is left alone.",
        ()=>syncDisconnect(), "Disconnect"); break;
    case "export-json": exportJSON(); break;
    case "import-json": importJSON(); break;
    case "demo-load": loadDemo(); break;
    case "demo-clear": clearDemo(); break;
    case "reset-all": confirmModal("Reset everything",
        "Your entries will be replaced by the starting data. Export a backup first if you want one.",
        ()=>{ DB = clone(SEED); commit(); toast("Reset to the starting data."); }, "Reset"); break;
  }
});

document.addEventListener("submit", e=>{
  const f = e.target.closest('[data-act="quickadd-form"]'); if(!f) return;
  e.preventDefault();
  const inp = $("#qa"); const raw = inp.value.trim(); if(!raw) return;
  const p = parseQuickTodo(raw);
  addTodo({ title:p.title, due:p.due, priority:p.priority, area: UI.todoArea==="all" ? "Ops" : UI.todoArea });
  inp.value = "";
  save(); render();
  setTimeout(()=>{ const q=$("#qa"); if(q) q.focus(); },30);
});

document.addEventListener("input", e=>{
  if(e.target.id === "schoolq"){
    UI.schoolQuery = e.target.value;
    clearTimeout(window._sq);
    window._sq = setTimeout(()=>{ render(); const q=$("#schoolq"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }, 260);
  }
});

document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key === "n" && !e.metaKey && !e.ctrlKey){ e.preventDefault(); formTodo(null); }
  if(e.key === "/"){ e.preventDefault(); go("schools"); setTimeout(()=>{ const q=$("#schoolq"); if(q) q.focus(); },50); }
});

/* =====================================================================
   20. BOOT
   ===================================================================== */
load();
if(DB.settings.theme && DB.settings.theme !== "auto") document.documentElement.setAttribute("data-theme", DB.settings.theme);
DB.settings.lastQuote = Math.floor(Math.random()*Math.max(1,DB.quotes.length));
render();
restoreFromFile();
ghSync();
/* push anything queued before the tab goes away */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden" && GH.mode === "pending"){ clearTimeout(ghTimer); ghPush().catch(()=>{}); }
});
window.openSchool = openSchool;
</script>
